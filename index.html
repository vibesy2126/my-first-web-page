<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibesy | Web & App Builder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 520px;
      padding: 2rem;
      border-radius: 20px;
      background: #111827;
      border: 1px solid #1f2937;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.14);
      color: #38bdf8;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.6rem; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: #38bdf8;
      color: #090d16;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    #status {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #34d399;
      min-height: 1.2rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Week 1 • Build Log</span>
    <h1>Building Remote-Ready Web Apps</h1>
    <p>Starting from scratch on iPad Pro M4, shipping clean code to GitHub, and building real skills step by step.</p>
    <button id="pingBtn" type="button">Test Interactivity</button>
    <div id="status"></div>
  </main>

  <script>
    const btn = document.getElementById("pingBtn");
    const status = document.getElementById("status");
    let clicks = 0;

    btn.addEventListener("click", () => {
      clicks += 1;
      status.textContent = `Live script active — click count: ${clicks}`;
    });
  </script>
</body>
</html>
